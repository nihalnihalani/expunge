<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" aria-labelledby="t d" role="img" viewBox="0 0 1280 600"><title id="t">The Expunge improvement loop</title><desc id="d">Two lanes. Run: durable worker, domain gateway with typed tools, world database with transactional effects, committed completion receipt. Improve: grader on a private database, evidence read back by the observer, typed proposal, compiler with a rejection catalog, gate on fresh paired worlds, single-use human grant, atomic promotion. The compiler can reject and the gate can hold. Promotion feeds back to the worker, which pins the newly active harness.</desc><rect width="1280" height="600" fill="#16171A" rx="16"/><defs><marker id="ah" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#ECEBE8" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahs" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#93A6FF" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahg" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7C7F89" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1232" height="196" x="24" y="28" fill="none" stroke="#2A2B30" rx="14"/><text x="146" y="58" fill="#ECEBE8" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="18" font-weight="500" text-anchor="start">Run</text><text x="188.2" y="58" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">every cleanup job, under the active harness</text><rect width="238" height="104" x="92" y="76" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="211" y="106" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Durable worker</text><text x="211" y="128" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">fixed model, fenced lease</text><text x="211" y="146" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">pinned to the active harness</text><rect width="238" height="104" x="396" y="76" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="515" y="106" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Domain gateway</text><text x="515" y="128" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">typed tools only: inspect,</text><text x="515" y="146" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">resolve, discover, preview…</text><rect width="238" height="104" x="700" y="76" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="819" y="106" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">World database</text><text x="819" y="128" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">delete, redact, restrict,</text><text x="819" y="146" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">tombstone in transactions</text><rect width="238" height="104" x="1004" y="76" fill="#1D2442" stroke="#93A6FF" stroke-width="1.6" rx="10"/><text x="1123" y="106" fill="#93A6FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Completion receipt</text><text x="1123" y="128" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">committed, and honest</text><text x="1123" y="146" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">when incomplete</text><line x1="334" x2="390" y1="128" y2="128" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="638" x2="694" y1="128" y2="128" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="942" x2="998" y1="128" y2="128" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><rect width="1232" height="300" x="24" y="262" fill="none" stroke="#2A2B30" rx="14"/><text x="146" y="292" fill="#ECEBE8" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="18" font-weight="500" text-anchor="start">Improve</text><text x="225.8" y="292" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">between harness versions, only from measured failures</text><rect width="150" height="122" x="49" y="318" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="124" y="348" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Grader</text><text x="124" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">private database,</text><text x="124" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">sealed post-states</text><text x="124" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">the worker can’t read</text><rect width="150" height="122" x="221" y="318" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="296" y="348" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Evidence</text><text x="296" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">outbox spans read</text><text x="296" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">back by the observer,</text><text x="296" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">leak-guarded</text><rect width="150" height="122" x="393" y="318" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="468" y="348" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Proposal</text><text x="468" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">typed edit to context,</text><text x="468" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">workflow, guardrails</text><text x="468" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">or tool policy</text><rect width="150" height="122" x="565" y="318" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="640" y="348" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Compiler</text><text x="640" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">61-code rejection</text><text x="640" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">catalog; computes</text><text x="640" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">the authority class</text><rect width="150" height="122" x="737" y="318" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="812" y="348" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Gate</text><text x="812" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">parent vs candidate</text><text x="812" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">on fresh paired</text><text x="812" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">worlds (38 pairs)</text><rect width="150" height="122" x="909" y="318" fill="#1F2024" stroke="#36383E" stroke-width="1" rx="10"/><text x="984" y="348" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Human grant</text><text x="984" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">descriptor of every</text><text x="984" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">changed capability;</text><text x="984" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">single use</text><rect width="150" height="122" x="1081" y="318" fill="#1D2442" stroke="#93A6FF" stroke-width="1.6" rx="10"/><text x="1156" y="348" fill="#93A6FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Promotion</text><text x="1156" y="370" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">atomic CAS of the</text><text x="1156" y="388" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">active harness;</text><text x="1156" y="406" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">rollback the same</text><line x1="202" x2="217" y1="379" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="374" x2="389" y1="379" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="546" x2="561" y1="379" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="718" x2="733" y1="379" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="890" x2="905" y1="379" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="1062" x2="1077" y1="379" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="640" x2="640" y1="442" y2="474" stroke="#7C7F89" stroke-dasharray="4 3" stroke-width="1.3" marker-end="url(#ahg)"/><text x="640" y="492" fill="#7C7F89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-style="italic" font-weight="400" text-anchor="middle">rejected</text><line x1="812" x2="812" y1="442" y2="474" stroke="#7C7F89" stroke-dasharray="4 3" stroke-width="1.3" marker-end="url(#ahg)"/><text x="812" y="492" fill="#7C7F89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-style="italic" font-weight="400" text-anchor="middle">held</text><path fill="none" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)" d="M 1123 182 V 236 H 124 V 312"/><text x="1111" y="254" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="end">graded after the run</text><path fill="none" stroke="#93A6FF" stroke-width="2" marker-end="url(#ahs)" d="M 1156 442 V 504 H 32 V 128 H 86"/><text x="1144" y="522" fill="#93A6FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="end">the next job pins the newly active harness</text></svg>