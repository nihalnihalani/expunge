ca,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">atomic CAS of the</text><text x="1156" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">active harness;</text><text x="1156" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">rollback the same</text><line x1="202" y1="379" x2="217" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="374" y1="379" x2="389" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="546" y1="379" x2="561" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="718" y1="379" x2="733" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="890" y1="379" x2="905" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="1062" y1="379" x2="1077" y2="379" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="640" y1="442" x2="640" y2="474" stroke="#7C7F89" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ahg)"/><text x="640" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#7C7F89" text-anchor="middle" font-style="italic">rejected</text><line x1="812" y1="442" x2="812" y2="474" stroke="#7C7F89" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ahg)"/><text x="812" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#7C7F89" text-anchor="middle" font-style="italic">held</text><path d="M 1123 182 V 236 H 124 V 312" fill="none" stroke="#ECEBE8" stroke-width="1.5" marker-end="url(#ah)"/><text x="1111" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,