le-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A6A9B3" text-anchor="start">between harness versions, only from measured failures</text><rect x="49" y="318" width="150" height="122" rx="10" fill="#1F2024" stroke="#36383E" stroke-width="1"/><text x="124" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ECEBE8" text-anchor="middle">Grader</text><text x="124" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">private database,</text><text x="124" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">sealed post-states</text><text x="124" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">the worker can’t read</text><rect x="221" y="318" width="150" height="122" rx="10" fill="#1F2024" stroke="#36383E" stroke-width="1"/><text x="296" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ECEBE8" text-anchor="middle">Evidence</text><text x="296" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">outbox spans read</text><text x="296" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">back by the observer,</text><text x="296" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">leak-guarded</text><rect x="393" y="318" width="150" height="122" rx="10" fill="#1F2024" stroke="#36383E" stroke-width="1"/><text x="468" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ECEBE8" text-anchor="middle">Proposal</text><text x="468" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">typed edit to context,</text><text x="468" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">workflow, guardrails</text><text x="468" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">or tool policy</text><rect x="565" y="318" width="150" height="122" rx="10" fill="#1F2024" stroke="#36383E" stroke-width="1"/><text x="640" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ECEBE8" text-anchor="middle">Compiler</text><text x="640" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">61-code rejection</text><text x="640" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">catalog; computes</text><text x="640" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#A6A9B3" text-anchor="middle">the authority class</text><rect x="737" y="318" width="150" height="122" rx="10" fill="#1F2024" stroke="#36383E" stroke-width="1"/><text x="812" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helv