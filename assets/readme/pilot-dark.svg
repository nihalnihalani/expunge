<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" aria-labelledby="t d" role="img" viewBox="0 0 1280 470"><title id="t">Pilot: targeted residuals left per world</title><desc id="d">Grouped bar chart of residuals per pair. On direct_nested pairs 0, 2 and 4, W0 leaves 5 residuals each and the candidate leaves 0. On alias_two_hop pairs 1, 3 and 5, both arms leave 6. Useful completions: W0 0 of 6, candidate 3 of 6; residuals 33 vs 18; 0 collateral in both.</desc><rect width="1280" height="470" fill="#16171A" rx="16"/><text x="40" y="52" fill="#ECEBE8" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="26" font-weight="500" text-anchor="start">Pilot: targeted residuals left per world</text><text x="40" y="78" fill="#A6A9B3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Six fresh paired worlds, real model, all 12 receipts verified, 0 collateral. Lower is better; 0 means the receipt is complete in registered scope.</text><rect width="14" height="14" x="40" y="98" fill="#d95926" rx="3"/><text x="62" y="110" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="start">W0 baseline harness</text><rect width="14" height="14" x="220" y="98" fill="#9085e9" rx="3"/><text x="242" y="110" fill="#ECEBE8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="start">candidate f1eb5184</text><text x="78" y="374" fill="#A6A9B3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="end">0</text><line x1="92" x2="908" y1="370" y2="370" stroke="#36383E" stroke-width="1.4"/><text x="78" y="300.667" fill="#A6A9B3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" f