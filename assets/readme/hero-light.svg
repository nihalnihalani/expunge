<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" aria-labelledby="t d" role="img" viewBox="0 0 1280 400"><title id="t">Expunge</title><desc id="d">Expunge wordmark beside an illustration of a cleanup receipt: four collections show redaction bars for deleted, redacted and tombstoned data, one collection is marked not inspected, and a blue committed-receipt seal sits next to an amber incomplete-in-registered-scope label.</desc><rect width="1280" height="400" fill="#F8F7F4" rx="16"/><rect width="51.2" height="5.12" x="78.4" y="103.2" fill="#1D1F24" rx="2.56"/><rect width="11.2" height="5.12" x="78.4" y="121.44" fill="#1D1F24" rx="2.56"/><rect width="35.2" height="15.36" x="94.4" y="116.32" fill="#1D1F24" rx="2.56"/><rect width="32" height="5.12" x="78.4" y="139.68" fill="#1D1F24" rx="2.56"/><text x="156" y="145" fill="#1D1F24" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="76" font-weight="500" text-anchor="start">Expunge</text><text x="74" y="212" fill="#1D1F24" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="25" font-weight="400" text-anchor="start">A database-cleanup agent that rewrites</text><text x="74" y="246" fill="#1D1F24" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="25" font-weight="400" text-anchor="start">its own harness from measured failures.</text><text x="74" y="300" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">The model stays fixed. The context, workflow, guardrails and</text><text x="74" y="322" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">tool grants around it change only when a gate on fresh worlds</text><text x="74" y="344" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">says they should, and the database commits every step.</text><rect width="540" height="320" x="672" y="40" fill="#FFF" stroke="#DAD7CF" rx="12"/><text x="696" y="74" fill="#1D1F24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Cleanup of one synthetic customer</text><text x="1188" y="74" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-style="italic" font-weight="400" text-anchor="end">illustration</text><line x1="696" x2="1188" y1="90" y2="90" stroke="#ECEAE4"/><text x="696" y="122" fill="#1D1F24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" text-anchor="start">customers</text><rect width="150" height="17" x="822" y="109" fill="#1D1F24" rx="2"/><text x="1188" y="122" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">deleted</text><text x="696" y="158" fill="#1D1F24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" text-anchor="start">accounts</text><rect width="118" height="17" x="822" y="145" fill="#1D1F24" rx="2"/><text x="1188" y="158" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">deleted</text><text x="696" y="194" fill="#1D1F24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" text-anchor="start">messages</text><rect width="196" height="17" x="822" y="181" fill="#1D1F24" rx="2"/><text x="1188" y="194" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">redacted</text><text x="696" y="230" fill="#1D1F24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" text-anchor="start">events</text><rect width="90" height="17" x="822" y="217" fill="#1D1F24" rx="2"/><text x="1188" y="230" fill="#5C5F6B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">tombstoned</text><text x="696" y="266" fill="#1D1F24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" text-anchor="start">archives</text><rect width="170" height="17" x="822" y="253" fill="#FBF0DC" stroke="#9A5800" stroke-dasharray="4 3" rx="2"/><text x="1188" y="266" fill="#9A5800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="end">not inspected</text><line x1="696" x2="1188" y1="310" y2="310" stroke="#2B48C8" stroke-width="2"/><rect width="236" height="26" x="696" y="322" fill="#E9EDFC" stroke="#2B48C8" rx="13"/><circle cx="714" cy="335" r="5" fill="none" stroke="#2B48C8" stroke-width="1.6"/><text x="728" y="340" fill="#2B48C8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start">Committed completion receipt</text><rect width="244" height="26" x="944" y="322" fill="#FBF0DC" stroke="#9A5800" rx="13"/><text x="1066" y="340" fill="#9A5800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Incomplete in registered scope</text></svg>