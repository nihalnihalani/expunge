<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
<title id="t">The Expunge improvement loop</title><desc id="d">Two lanes. Run: durable worker, domain gateway with typed tools, world database with transactional effects, committed completion receipt. Improve: grader on a private database, evidence read back by the observer, typed proposal, compiler with a rejection catalog, gate on fresh paired worlds, single-use human grant, atomic promotion. The compiler can reject and the gate can hold. Promotion feeds back to the worker, which pins the newly active harness.</desc>
<rect width="1280" height="600" rx="16" fill="#16171A"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEBE8"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A6FF"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C7F89"/></marker>
