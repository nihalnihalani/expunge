<title id="t">Pilot: targeted residuals left per world</title><desc id="d">Grouped bar chart of residuals per pair. On direct_nested pairs 0, 2 and 4, W0 leaves 5 residuals each and the candidate leaves 0. On alias_two_hop pairs 1, 3 and 5, both arms leave 6. Useful completions: W0 0 of 6, candidate 3 of 6; residuals 33 vs 18; 0 collateral in both.</desc>
