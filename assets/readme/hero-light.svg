<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Expunge</title><desc id="d">Expunge wordmark beside an illustration of a cleanup receipt: four collections show redaction bars for deleted, redacted and tombstoned data, one collection is marked not inspected, and a blue committed-receipt seal sits next to an amber incomplete-in-registered-scope label.</desc>
<rect width="1280" height="400" rx="16" fill="#F8F7F4"/>
<rect x="78.4" y="103.2" width="51.2" height="5.120000000000001" rx="2.5600000000000005" fill="#1D1F24"/><rect x="78.4" y="121.44" width="11.200000000000001" height="5.120000000000001" rx="2.5600000000000005" fill="#1D1F24"/><rect x="94.4" y="116.32" width="35.2" height="15.36" rx="2.5600000000000005" fill="#1D1F24"/><rect x="78.4" y="139.68" width="32" height="5.120000000000001" rx="2.5600000000000005" fill="#1D1F24"/><text x="156" y="145" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="76" font-weight="500" fill="#1D1F24" text-anchor="start">Expunge</text><text x="74" y="212" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="25" font-weight="400" fill="#1D1F24" text-anchor="start">A database-cleanup agent that rewrites</text><text x="74" y="246" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,serif" font-size="25" font-weight="400" fill="#1D1F24" text-anchor="start">its own harness from measured failures.</text><text x="74" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5C5F6B" text-anchor="start">The model stays fixed. The context, workflow, guardrails and</text><text x="74" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5C5F6B" text-anchor="start">tool grants around it change only when a gate on fresh worlds</text><text x="74" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5C5F6B" text-anchor="start">says they should, and the database commits every step.</text><rect x="672" y="40" width="540" height="320" rx="12" fill="#FFFFFF" stroke="#DAD7CF"/><text x="696" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1D1F24" text-anchor="start">Cleanup of one synthetic customer</text><text x="1188" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5C5F6B" text-anchor="end" font-style="italic">illustration</text><line x1="696" y1="90" x2="1188" y2="90" stroke="#ECEAE4"/><text x="696" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#1D1F24" text-anchor="start">customers</text><rect x="822" y="109" width="150" height="17" rx="2" fill="#1D1F24"/><text x="1188" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5C5F6B" text-anchor="end">deleted</text><text x="696" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#1D1F24" text-anchor="start">accounts</text><rect x="822" y="145" width="118" height="17" rx="2" fill="#1D1F24"/><text x="1188" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5C5F6B" text-anchor="end">deleted</text><text x="696" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#1D1F24" text-anchor="start">messages</text><rect x="822" y="181" width="196" height="17" rx="2" fill="#1D1F24"/><text x="1188" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5C5F6B" text-anchor="end">redacted</text><text x="696" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#1D1F24" text-anchor="start">events</text><rect x="822" y="217" width="90" height="17" rx="2" fill="#1D1F24"/><text x="1188" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5C5F6B" text-anchor="end">tombstoned</text><text x="696" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#1D1F24" text-anchor="start">archives</text><rect x="822" y="253" width="170" height="17" rx="2" fill="#FBF0DC" stroke="#9A5800" stroke-dasharray="4 3"/><text x="1188" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9A5800" text-anchor="end">not inspected</text><line x1="696" y1="310" x2="1188" y2="310" stroke="#2B48C8" stroke-width="2"/><rect x="696" y="322" width="236" height="26" rx="13" fill="#E9EDFC" stroke="#2B48C8"/><circle cx="714" cy="335" r="5" fill="none" stroke="#2B48C8" stroke-width="1.6"/><text x="728" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2B48C8" text-anchor="start">Committed completion receipt</text><rect x="944" y="322" width="244" height="26" rx="13" fill="#FBF0DC" stroke="#9A5800"/><text x="1066" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9A5800" text-anchor="middle">Incomplete in registered scope</text>
</svg>
